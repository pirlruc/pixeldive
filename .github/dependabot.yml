# Org-default Dependabot seed (SC-DEP-001/002/003).
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
