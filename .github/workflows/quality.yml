name: quality

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init guardrails analog
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/ci-init-guardrails.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # PY-RUN-003 / QUAL-002: CPython 3.13 (org profile). Not 3.14 until 2027-04.
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --require-hashes -r scripts/requirements-runtime.txt
          python -m pip install --require-hashes -r scripts/requirements-dev-hashed.txt

      - name: Generate protobuf stubs
        run: bash scripts/generate_proto.sh

      - name: Proto drift
        run: git diff --exit-code -- app/pb

      - name: PY-* gates
        run: bash scripts/check-ci-local.sh

  docker-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Submodule pins (SC-DEP-004)
        run: bash scripts/check-submodule-pins.sh

      # Non-dependabot PRs run these in ops-reuse.yml (common-infra-lint,
      # container-iac). Dependabot cannot read the ops-repo tokens (CI-024).
      # pull_request.user.login is the PR author. github.actor is the last
      # actor on the head commit and zizmor bot-conditions rejects it.
      - name: Hadolint
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: bash scripts/run-hadolint.sh

      - name: KICS
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: bash scripts/run-kics.sh

      - name: ShellCheck
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: bash scripts/run-shellcheck.sh

      - name: actionlint
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: bash scripts/run-actionlint.sh

      - name: Set up uv
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          # workflow_dispatch makes a default uv cache a zizmor cache-poisoning finding.
          enable-cache: false

      - name: zizmor
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: bash scripts/run-zizmor.sh

      - name: Compose spec
        run: docker compose -f docker-compose.yml --profile s3 config --quiet

  uv-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: uv.lock matches pyproject.toml
        run: uv lock --check

      - name: requirements.txt matches uv export
        run: bash scripts/check-uv-export.sh

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixeldive
          POSTGRES_PASSWORD: pixeldive
          POSTGRES_DB: pixeldive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixeldive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # PY-RUN-003 / QUAL-002: CPython 3.13 (org profile). Not 3.14 until 2027-04.
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --require-hashes -r scripts/requirements-runtime.txt
          python -m pip install --require-hashes -r scripts/requirements-dev-hashed.txt

      - name: Generate protobuf stubs
        run: bash scripts/generate_proto.sh

      - name: Alembic check and SessionService tests on PostgreSQL
        env:
          PIXELDIVE_TEST_DATABASE_URL: postgresql+asyncpg://pixeldive:pixeldive@localhost:5432/pixeldive
        run: bash scripts/ci-postgres.sh

  ios-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect ios changes
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}" HEAD | grep -q '^ios/'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  ios-sdk:
    # Linux swift test covers pull requests that do not touch ios/.
    # macos-15 runs on main, tags, workflow_dispatch, and ios/** pull requests.
    needs: ios-changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.ios-changes.outputs.ios == 'true')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init guardrails analog
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/ci-init-guardrails.sh

      - name: SWIFT-* gates
        env:
          PIXELDIVE_REQUIRE_SWIFT: "1"
        run: bash scripts/check-ios-sdk.sh

      - name: Trivy iOS sources (SWIFT-SEC-004)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ios
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .build

  android-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init guardrails analog
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/ci-init-guardrails.sh

      # GitHub-hosted runners have no Android Studio JBR. Local
      # scripts/check-android-sdk.sh uses /opt/android-studio/jbr when
      # it is present. macos-15 is the iOS final gate; this job is the
      # Android final gate.
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: KT-* gates
        env:
          PIXELDIVE_REQUIRE_JAVA: "1"
        run: bash scripts/check-android-sdk.sh

      - name: Trivy Android sources (KT-SEC-004)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: android
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Fuzz filename and magic sniffing
        run: PYTHONPATH=. uv run --with atheris python fuzz/fuzz_ingest.py -runs=200
