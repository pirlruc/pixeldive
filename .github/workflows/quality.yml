name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Init guardrails analog
        env:
          GUARDRAILS_READ_TOKEN: ${{ secrets.GUARDRAILS_READ_TOKEN }}
        run: bash scripts/ci-init-guardrails.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in lockstep with Dockerfile and requires-python (QUAL-002).
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate protobuf stubs
        run: bash scripts/generate_proto.sh

      - name: PY-* gates
        run: bash scripts/ci-local.sh

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixeldive
          POSTGRES_PASSWORD: pixeldive
          POSTGRES_DB: pixeldive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixeldive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in lockstep with Dockerfile and requires-python (QUAL-002).
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate protobuf stubs
        run: bash scripts/generate_proto.sh

      - name: Alembic + SessionService tests on PostgreSQL
        env:
          PIXELDIVE_TEST_DATABASE_URL: postgresql+asyncpg://pixeldive:pixeldive@localhost:5432/pixeldive
        run: bash scripts/ci-postgres.sh
