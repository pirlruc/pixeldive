name: hub-description

# workflow_dispatch only. A push trigger called container-hub-description at
# 6.5.0, and that revision wrote this page onto pirlruc/ci-container.
on:
  workflow_dispatch:

permissions: {}

jobs:
  overview:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-hub-description.yml@b1cf0dead2b1a501bf1433fe72cdbbdad4e9132d # 6.10.0
    with:
      dockerhub_image: pirlruc/pixeldive
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: Async image-processing sessions over HTTP and gRPC.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
