name: ops-reuse

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ops-reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025. Each reusable caller grants only what that workflow needs.
# This file does not check out commondevops or containerdevops. Those
# workflows sparse-checkout their own scripts with the read tokens below.
permissions: {}

jobs:
  infra:
    # CI-024: Dependabot cannot read COMMONDEVOPS_READ_TOKEN. docker-lint
    # runs the in-repo scripts for that actor.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: true
      dockerfiles: Dockerfile
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    # CI-024: Dependabot cannot read CONTAINERDEVOPS_READ_TOKEN.
    # compose --profile s3 stays in docker-lint; this reusable omits the profile.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-iac.yml@2dd60d34418051fb0505f476d926b20550becfad
    with:
      blocking: true
      paths: Dockerfile,docker-compose.yml
      scripts_ref: 2dd60d34418051fb0505f476d926b20550becfad
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
