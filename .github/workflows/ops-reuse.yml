name: ops-reuse

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ops-reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025. Each reusable caller grants only what that workflow needs.
# This file does not check out commondevops or containerdevops. Those
# workflows sparse-checkout their own scripts with the read tokens below.
permissions: {}

jobs:
  infra:
    # CI-024: Dependabot cannot read COMMONDEVOPS_READ_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@4a7c8c431090f32bb0febcd42f5ac8ef2d405e0e
    with:
      blocking: true
      dockerfiles: Dockerfile
      run_shfmt: true
      scripts_ref: 4a7c8c431090f32bb0febcd42f5ac8ef2d405e0e
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@4a7c8c431090f32bb0febcd42f5ac8ef2d405e0e
    with:
      blocking: true
      scripts_ref: 4a7c8c431090f32bb0febcd42f5ac8ef2d405e0e
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  scaffold:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@4a7c8c431090f32bb0febcd42f5ac8ef2d405e0e
    with:
      blocking: true
      scripts_ref: 4a7c8c431090f32bb0febcd42f5ac8ef2d405e0e
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    # CI-024: Dependabot cannot read CONTAINERDEVOPS_READ_TOKEN.
    # The upload job declares actions and security-events. Extra scopes fail startup.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-iac.yml@416e31ea127d4a3249e1f3159a95679f93cfabd7
    with:
      blocking: true
      paths: Dockerfile,docker-compose.yml
      scripts_ref: 416e31ea127d4a3249e1f3159a95679f93cfabd7
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
