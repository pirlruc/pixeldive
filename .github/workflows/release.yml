name: release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# CI-025. Publish grants packages: write. Hub description grants contents only.
permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      image_name: pixeldive
      dockerhub_image: pirlruc/pixeldive
      platforms: linux/amd64
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      tag_latest: true
      verify_platforms: true
      verify_command: python -m app.settings_storage
      structure_test_config: container-structure-test.yml
      image_title: pixeldive
      image_description: Async image-processing sessions over HTTP and gRPC.
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: Async image-processing sessions over HTTP and gRPC.
      environment: release
      scripts_ref: b8c0746603eefdc89571b17c62d1e965b28ff31f
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}

  hub-description:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-hub-description.yml@b8c0746603eefdc89571b17c62d1e965b28ff31f
    with:
      dockerhub_image: pirlruc/pixeldive
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: Async image-processing sessions over HTTP and gRPC.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
