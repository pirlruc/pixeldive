[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=69"]

[project]
name = "pixeldive"
version = "0.1.0"
description = "Image-processing session management (FastAPI + gRPC)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Nuno Monteiro"}]
license = "MIT"
dependencies = [
  "alembic==1.15.2",
  "aiobotocore==2.23.0",
  "aiofiles==25.1.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "grpcio==1.71.0",
  "protobuf==5.29.6",
  "pydantic-settings==2.15.0",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.32",
  "sqlmodel==0.0.42",
  "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "bandit==1.8.6",
  "coverage==7.16.1",
  "grpcio-tools==1.71.0",
  "httpx==0.28.1",
  "interrogate==1.7.0",
  "mypy==1.15.0",
  "pip-audit==2.9.0",
  "pydoclint==0.7.3",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "radon==6.0.1",
  "ruff==0.16.8",
  "types-aiofiles==25.1.0.20260518",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["app", "main", "sdk", "demo"]
omit = ["app/pb/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.interrogate]
fail-under = 95
ignore-init-method = false
ignore-init-module = true
ignore-module = false
ignore-nested-functions = false
ignore-private = false
ignore-semiprivate = false
ignore-magic = true
omit-covered-files = false
ignore-regex = ["^test_"]
exclude = ["app/pb", "tests", "migrations"]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
python_version = "3.13"
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
mypy_path = [".", "sdk"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "aiobotocore",
  "aiobotocore.*",
  "google.protobuf.*",
  "grpc",
  "grpc.*",
]

[[tool.mypy.overrides]]
ignore_errors = true
module = ["app.pb.*"]

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = ["tests.*"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
addopts = "--cov=app --cov=main --cov=sdk --cov=demo --cov-branch --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = [".", "sdk"]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "migrations", "app/pb"]

[tool.ruff]
extend-exclude = ["app/pb"]
line-length = 100
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"app/rest/api.py" = ["B008"]
"app/rest/api_images.py" = ["B008"]
"app/rest/api_deps.py" = ["B008"]
"app/models.py" = ["UP037", "UP007"]
"demo/app.py" = ["B008"]
"demo/routes.py" = ["B008"]
"demo/ui.py" = ["E501"]
"app/pb/**" = ["D", "E", "F", "I", "UP"]
"scripts/**" = ["D", "E501"]
"tests/**" = ["D", "DOC", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
exclude = '\.venv|app/pb|migrations|tests|\.github'
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
check-return-types = true
skip-checking-short-docstrings = true
require-return-section-when-returning-nothing = false
allow-init-docstring = true
quiet = true
