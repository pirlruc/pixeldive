version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Published RPC and message names predate this gate. Renaming them
    # would break generated clients without changing the wire format.
    # PROTO-API-001 still rejects wire breaks. New files are linted.
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
