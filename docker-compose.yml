services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pixeldive
      POSTGRES_PASSWORD: pixeldive
      POSTGRES_DB: pixeldive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixeldive"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://pixeldive:pixeldive@db:5432/pixeldive
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_ROOT: /data/images
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8000"
      GRPC_PORT: "50051"
      AUTO_CREATE_TABLES: "false"
      LOG_JSON: "true"
      GRPC_INSECURE: "true"
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-pixeldive}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      GC_MIN_AGE_SECONDS: ${GC_MIN_AGE_SECONDS:-5}
      ORPHAN_MIN_AGE_SECONDS: ${ORPHAN_MIN_AGE_SECONDS:-60}
      ORPHAN_SWEEP_INTERVAL_SECONDS: ${ORPHAN_SWEEP_INTERVAL_SECONDS:-0}
    ports:
      - "8000:8000"
      - "50051:50051"
    volumes:
      - images:/data/images
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then exit 1; fi
          sleep 1
        done
        mc mb --ignore-existing local/pixeldive

volumes:
  pgdata:
  images:
  minio:
