services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pixeldive
      POSTGRES_PASSWORD: pixeldive
      POSTGRES_DB: pixeldive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixeldive"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://pixeldive:pixeldive@db:5432/pixeldive
      STORAGE_BACKEND: local
      STORAGE_ROOT: /data/images
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8000"
      GRPC_PORT: "50051"
    ports:
      - "8000:8000"
      - "50051:50051"
    volumes:
      - images:/data/images
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  images:
