        status: done
        title: iOS SDK and SwiftUI capture demo
        overview:
          problem: >-
            Capture clients on iPhone have no first-party SDK. The Python RestClient
            and Android-shaped session JSON exist, but there is no Swift client that
            maps UIDevice/AVCaptureDevice into those keys or a demo app that exercises
            create/upload/download on device.
          goal: >-
            Ship a Swift 6 SPM library (PixeldiveSDK) that mirrors RestClient over
            REST, plus a SwiftUI demo that uses only that library, while proposing
            Swift guardrails that Kotlin already has (complexity, structured
            concurrency, ATS, token storage).
        architecture:
          target: >-
            In the context of iOS capture clients uploading processing sessions,
            facing an Android-first JSON contract and no Swift analog in this repo,
            we decided on a Foundation URLSession SDK that encodes the existing
            Android wire keys plus metadata.platform=ios, rather than forking the
            backend schema, so one SessionService keeps validating both phones.
          modules:
            - ios
            - ios/Demo
            - tests/test_ios_sdk.py
            - docs/new-guardrails/swift.md
        acceptance_criteria:
          - PixeldiveClient covers health, ready, session CRUD, image upload/list/download
          - DeviceSnapshot.sampleiPhone() matches the bundled fixture and SessionCreate
          - SwiftUI demo creates a session, uploads a photo, and downloads it via the SDK
          - Public image JSON from the SDK does not include storage_path
          - Proposed SWIFT-CPLX/CONC/IOS/SEC IDs live under docs/new-guardrails/swift.md
          - Shipped on main in https://github.com/pirlruc/pixeldive/pull/12
            (iOS work opened as https://github.com/pirlruc/pixeldive/pull/11)
        guardrail_refs:
