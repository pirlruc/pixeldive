      - id: SDK-008
        status: open
        title: Custom CA / private PKI trust for iOS and Android clients
        overview:
          problem: >-
            Python RestClient and GrpcClient now accept a custom CA so lab
            self-signed HTTPS/gRPC TLS works without disabling verification.
            iOS URLSession and Android OkHttp still use the platform trust
            store only. Private CAs used with SEC-007 will fail on device
            unless operators install a system profile.
          goal: >-
            Let PixeldiveClient load an optional PEM CA (or pinned server
            cert) on iOS and Android without turning TLS verification off.
            Keep redirect and bearer-header hardening.
        architecture:
          target: >-
            In the context of mobile clients talking to a privately minted
            HTTPS service, facing platform trust stores that do not include
            lab CAs, we decided to add an explicit CA/pin option on each
            PixeldiveClient rather than documenting "disable ATS / trust
            user certs", so verification stays on.
          modules:
            - ios
            - android/sdk
        acceptance_criteria:
          - iOS PixeldiveClient can trust a PEM CA passed at init
          - Android PixeldiveClient can trust a PEM CA passed at init
          - HTTP (not HTTPS) base URLs remain valid for local demos
          - Verification is never disabled as the default
        guardrail_refs:
          - SWIFT-SEC-005
          - KT-SEC-005
        tasks:
          - id: SDK-008-T1
            status: open
            title: Add optional PEM CA trust to iOS and Android PixeldiveClient
            instructions:
              files:
                - ios/Sources/PixeldiveSDK
                - android/sdk/src/main/kotlin/com/pixeldive/sdk
            verification:
              - bash scripts/check-ios-sdk.sh
              - bash scripts/check-android-sdk.sh

  - name: Camera ingest
    epics:
      - id: PERF-005
        status: done
        title: Deduplicate ingest and cut per-frame work for camera sessions
        overview:
          problem: >-
            add_image and add_images_batch duplicated validate/quota/persist.
            Local storage copied every spool onto the content-addressed path.
            REST batch spooled files one after another and leaked completed
            spools if a later file failed. Every frame wrote the session row.
            Deleted sessions never released tenant byte quota. Magic sniff
            re-opened the spool with blocking I/O.
          goal: >-
            One ingest path, hardlink local spools, parallel REST spooling with
            cleanup, session row write only on CREATED→IN_PROGRESS, captured
            magic headers, and quota release on session delete so a phone can
            send many frames per session without extra copies or leaked caps.
        architecture:
          target: >-
            In the context of a mobile camera feed sending many images per
            session, facing duplicated ingest and a full copy per frame, we
            decided to unify SessionService ingest, hardlink local spools, and
            skip per-frame session updates rather than add a new transport.
          modules:
            - app/session_batch.py
            - app/session_ops.py
            - app/local_write.py
            - app/api_images.py
            - app/magic.py
            - app/quotas.py
            - app/auth.py
        acceptance_criteria:
          - add_image shares persist/quota with add_images_batch
          - Local save_file hardlinks when the filesystem allows it
          - REST batch spools concurrently and deletes finished spools on failure
          - Session.updated_at is not written on every subsequent frame
          - Session delete returns reserved tenant/session upload bytes
        guardrail_refs:
          - PY-CPLX-001
          - PY-TEST-002
          - PY-SEC-002
        tasks:
          - id: PERF-005-T1
            status: done
            title: Unify ingest, hardlink spools, and release quota on delete
            instructions:
              files:
                - app/session_batch.py
                - app/local_write.py
                - app/api_images.py
                - app/service.py
                - app/auth.py
            verification:
              - bash scripts/ci-local.sh

      - id: PERF-006
        status: open
        title: Stream browser camera frames without a second full-body hop
        overview:
          problem: >-
            Native demos now client-stream JPEG frames on gRPC and record the
            upload response locally. The Python capture page still encodes a
            JPEG and POSTs it as multipart. The demo now spills that body to a
            capped temp file and streams it with upload_image_from_path, but
            Starlette may still spool the multipart body and the browser still
            cannot speak h2c.
          goal: >-
            Keep session CRUD on REST. For the browser demo, stream the
            capture body into GrpcClient (chunked upload or WebSocket) so a
            live feed does not hold two full JPEGs. Leave native apps on
            direct PixeldiveGrpcClient. Optionally queue one in-flight frame
            instead of dropping while a slower upload finishes.
        architecture:
          target: >-
            In the context of a browser camera feed that cannot speak h2c,
            facing a full multipart POST into the demo before gRPC, we decided
            to keep the demo as the gRPC hop and stream the request body
            rather than add grpc-web or expose h2c to the browser.
          modules:
            - demo
            - sdk/pixeldive_sdk
        acceptance_criteria:
          - Browser camera upload does not read the whole JPEG into memory twice
          - Native iOS/Android demos stay on PixeldiveGrpcClient (no demo HTTP hop)
          - Session list/refresh is not called per frame
        guardrail_refs:
          - PY-CPLX-001
          - PY-TEST-002
        tasks:
          - id: PERF-006-T1
            status: open
            title: Stream the demo upload body into GrpcClient
            instructions:
              files:
                - demo/routes.py
                - demo/clients.py
                - sdk/pixeldive_sdk
            verification:
              - bash scripts/ci-local.sh

      - id: SDK-007
        status: open
        title: Production TLS gRPC and protobuf Struct metadata on mobile
        overview:
          problem: >-
            Mobile PixeldiveGrpcClient speaks prior-knowledge h2c and decodes
            SessionImage.metadata as an empty map. Hand-rolled codecs skip
            google.protobuf.Struct (field 8). Production ENVIRONMENT requires
            GRPC_INSECURE=false; phones cannot pin the local 127.0.0.1:50051
            channel.
          goal: >-
            TLS + ALPN h2 clients on iOS (NIO SSL) and Android (HTTPS HTTP/2),
            decode Struct metadata into the existing JSON map, and keep h2c
            as the explicit insecure() helper for local grpc.aio.
        architecture:
          target: >-
            In the context of shipping camera ingest past local demos, facing
            h2c-only mobile clients and dropped Struct metadata, we decided to
            add TLS constructors beside insecure() and decode field 8 as JSON
            rather than generating stubs on Linux CI.
          modules:
            - ios/Sources/PixeldiveSDK
            - android/sdk
        acceptance_criteria:
          - PixeldiveGrpcClient can open a TLS HTTP/2 channel with a bearer token
          - insecure() remains the h2c helper for local grpc.aio
          - SessionImage.metadata is populated from protobuf Struct field 8
        guardrail_refs:
          - SWIFT-TEST-002
          - KT-TEST-002
          - PY-SEC-002
        tasks:
          - id: SDK-007-T1
            status: open
            title: Add TLS gRPC constructors and Struct metadata decoding
            instructions:
              files:
                - ios/Sources/PixeldiveSDK
                - android/sdk
            verification:
              - bash scripts/check-ios-sdk.sh
              - bash scripts/check-android-sdk.sh
