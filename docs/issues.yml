      - id: DATA-004
        status: done
        title: Schedule the orphan blob sweeper in the running process
        overview:
          problem: >-
            sweep_orphans exists and is unit-tested, but main.run never calls
            it. Failed DB commits after persist_upload, and any remaining
            ingest races, leave content-addressed objects until an operator
            invokes the helper by hand. Default gc_min_age_seconds is 0, so
            delete-time GC also skips the DATA-002 age window unless configured.
          goal: >-
            Run sweep_orphans on an interval from the dual-server process, and
            document production GC_MIN_AGE_SECONDS / ORPHAN_MIN_AGE_SECONDS so
            concurrent same-hash uploads are not deleted before the row commits.
        architecture:
          target: Periodic sweeper task owned by main.run
          modules:
            - main.py
            - app/blob_gc.py
            - app/settings_storage.py
        acceptance_criteria:
          - A configurable interval greater than 0 runs sweep_orphans
          - Interval 0 keeps current test/dev behaviour (no background sweep)
          - README or .env.example documents a non-zero GC_MIN_AGE_SECONDS for production
          - Implemented in the Phase 3 hardening change (ORPHAN_SWEEP_INTERVAL_SECONDS)
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: DATA-004-T1
            status: done
            title: Add an optional orphan-sweep loop to main.run
            instructions:
              files:
                - main.py
                - app/settings_storage.py
            verification:
              - bash scripts/ci-local.sh

      - id: SEC-004
        status: open
        title: Share quota accounting across replicas
        overview:
          problem: >-
            SEC-002 enforces rate and byte caps inside one process. That is
            enough for many phones against a single app replica. Multiple
            app replicas each keep their own sliding window, so a captured
            key can multiply the configured cap by replica count.
          goal: >-
            Back TenantQuota with PostgreSQL so REST and gRPC across replicas
            share one cap, still skipped when AUTH_REQUIRED is false. Redis
            is a later follow-up ([SEC-005](issues.yml)) if quota writes
            contend under replica count and ingest QPS.
        architecture:
          target: >-
            In the context of horizontally scaled ingest, facing in-process
            quota counters, we decided to keep the SessionService quota API
            and back it with PostgreSQL (already the session store) rather
            than adding Redis or a proxy-only limiter, to share one cap
            without a new failure domain.
          modules:
            - app/quotas.py
            - app/service.py
            - migrations
        acceptance_criteria:
          - Two processes with the same API_KEYS share one rate/byte budget
          - AUTH_REQUIRED=false remains unlimited
          - Failure of the shared store fails closed when quotas are configured
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: SEC-004-T1
            status: open
            title: Replace in-process TenantQuota with a PostgreSQL backend
            instructions:
              files:
                - app/quotas.py
            verification:
              - bash scripts/ci-local.sh

      - id: QUAL-002
        status: done
        title: Align the runtime CPython minor with PY-RUN-003
        overview:
