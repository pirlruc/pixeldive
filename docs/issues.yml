      - id: PERF-002
        status: done
        title: Replace boto3 to_thread with an async S3 client
        overview:
          problem: >-
            S3 save/stream still used blocking boto3 via asyncio.to_thread.
            PERF-001 removed the extra HEAD-before-PUT and spools uploads, but
            a large object still occupied a worker thread for the whole PUT.
          goal: >-
            Use an async S3 client (aiobotocore) so blob I/O does not occupy
            the default executor. Keep SessionService as the owner of storage
            limits. Whole-file PUT memory remains PERF-003.
        architecture:
          target: >-
            In the context of S3-compatible blob I/O on the asyncio loop,
            facing blocking boto3, we decided on a lazy aiobotocore adapter
            behind StorageBackend rather than wrapping boto3 in to_thread, to
            keep PUT/GET off the default executor while build_storage stays
            synchronous.
          modules:
            - app/s3_storage.py
            - app/s3_client.py
            - app/s3_session.py
            - app/s3_types.py
            - requirements.txt
        acceptance_criteria:
          - S3 save_file and stream await an async client (no boto3, no to_thread)
          - Local filesystem backend behaviour is unchanged
          - Tests cover the async adapter with a fake client
          - Shipped on main in https://github.com/pirlruc/pixeldive/pull/7
        guardrail_refs:
          - PY-CPLX-001
        tasks:
          - id: PERF-002-T1
            status: done
            title: Swap S3CompatibleStorage to an async client
            instructions:
              files:
                - app/s3_storage.py
                - app/s3_client.py
                - requirements.txt
            verification:
              - bash scripts/ci-local.sh

  - name: Phase 3 — Remaining hardening
    epics:
      - id: TOOL-002
        status: open
        title: Publish GitHub Epic/Task issues from docs/issues.yml
        overview:
          problem: >-
            github-issue-adr treats GitHub issues as the decision log, but
            pixeldive has never run issues-sync.py against the live tracker.
            Statuses live only in docs/issues.yml. Publishing is gated on
            Issues: write plus the github-scaffold analog (TOOL-001-T1).
          goal: >-
            After TOOL-001-T1 and an Issues: write token, dry-run then apply
            issues-sync.py so every authored Epic/Task exists on GitHub with
            stable [ID] titles. Do not gh issue create by hand.
        architecture:
