# Authored backlog for pixeldive. Source of truth for GitHub Epic/Task issues.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/1.2.0/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.2.0/github-issue-adr
#
# The Epic is the decision record — there are no ADR markdown files.
# Deviations from guardrails go in docs/guardrail-deviations.yml, not here.
#
# `id` values are permanent: issues are matched by the [ID] in their title.
#
# Sync (after Issues: Read and write on the token, and github-scaffold is cloned):
#   bash scripts/setup-issue-scaffold.sh
#   bash scripts/issues-sync.sh --repo pirlruc/pixeldive --yaml docs/issues.yml --validate-only
#   bash scripts/issues-sync.sh --repo pirlruc/pixeldive --yaml docs/issues.yml --dry-run
#   bash scripts/issues-sync.sh --repo pirlruc/pixeldive --yaml docs/issues.yml
#
# GitHub issue objects are not published yet (Issues: write + github-scaffold
# analog still pending TOOL-001-T1). This file remains the decision log.
#
# Shipped on main via https://github.com/pirlruc/pixeldive/pull/1
# (merged 2026-09-19, commit c1eda05):
#   done  ARCH-001, DATA-001, API-001, QUAL-001, REV-001
#   done  TOOL-001-T2, TOOL-001-T3
#   done  SEC-001, PERF-001, DATA-002, OPS-001, API-002, SDK-001, PERF-002
#   open  TOOL-001 / TOOL-001-T1 (analog submodule pins)
#   open  TOOL-002, SEC-002, API-003, PERF-003, PERF-004, OPS-002, OPS-003, DATA-003

milestones:
  - name: Tooling — Analog & methodology
    epics:
      - id: TOOL-001
        status: open
        title: Pin analog repos and adopt github-issue-adr
        overview:
          problem: >-
            pixeldive started empty, so agents had no pinned guardrails, no
            authored backlog, and no issue templates. github-issue-adr requires
            Epic issues as decision records and docs/issues.yml as the manifest.
          goal: >-
            Adopt the same analog pins as FinSilo/Heimdall (guardrails 1.3.0,
            github-scaffold 1.2.0, methodologies cited at 1.2.0), sync Cursor
            rules and GitHub templates, and keep docs/issues.yml as the
            decision log. No docs/adr/ tree.
        architecture:
          target: Analog pins plus docs/issues.yml as the decision log
          modules:
            - docs/guardrails
            - .github/scaffold
            - docs/issues.yml
            - docs/issues-sync-targets.yml
            - scripts/issues-sync.sh
            - .cursor/rules
        acceptance_criteria:
          - Cursor rules and issue/PR templates match github-scaffold 1.2.0
          - docs/issues.yml is the authored backlog; no docs/adr/
          - Wrapper scripts under scripts/ call the scaffold copies
          - docs/guardrails is pinned at tag 1.3.0 when GUARDRAILS_READ_TOKEN exists
          - .github/scaffold is pinned at tag 1.2.0 when a Contents-read token exists
          - Phase 1 templates, Cursor rules, and this manifest shipped in pirlruc/pixeldive#1
        guardrail_refs:
          - PY-TEST-002
          - CI-022
        tasks:
          - id: TOOL-001-T1
            status: open
            title: Pin guardrails and github-scaffold submodules
            instructions:
              files:
                - .gitmodules
                - docs/guardrails
                - .github/scaffold
            verification:
              - git -C docs/guardrails describe --tags --exact-match HEAD
              - git -C .github/scaffold describe --tags --exact-match HEAD
          - id: TOOL-001-T2
            status: done
            title: Sync GitHub templates and Cursor rules from the scaffold analog
            instructions:
              files:
                - .github/ISSUE_TEMPLATE
                - .github/pull_request_template.md
                - .cursor/rules
                - docs/guardrail-deviations.yml
            verification:
              - test -f .github/ISSUE_TEMPLATE/epic-template.md
              - test -f .cursor/rules/github-issue-adr.mdc
          - id: TOOL-001-T3
            status: done
            title: Author issues.yml, targets, and root wrapper scripts
            instructions:
              files:
                - docs/issues.yml
                - docs/issues-sync-targets.yml
                - scripts/issues-sync.sh
                - scripts/setup-issue-scaffold.sh
                - scripts/sync-templates.sh
            verification:
              - test -f docs/issues.yml
              - test -x scripts/issues-sync.sh

  - name: Phase 1 — Session platform
    epics:
      - id: ARCH-001
        status: done
        title: Dual-transport session service with a single business layer
        overview:
          problem: >-
            Android capture clients (Heimdall app→kit→core SDK stack, FinSilo-style
            :app/:domain modules) need to open an image-processing session, attach
            device/camera identity, and upload frames. REST is convenient for
            mobile multipart; gRPC streaming is required for large/batch transfers.
            Two independent implementations would drift.
          goal: >-
            One SessionService owns sessions, images, and storage. FastAPI and
            gRPC are transports only. Device JSON matches Android Build,
            ActivityManager, DisplayMetrics, and Camera2 fields those clients
            already collect.
        architecture:
          target: >-
            In the context of Android capture clients uploading processing
            sessions, facing dual REST and gRPC needs, we decided on a single
            asyncio SessionService behind FastAPI and grpcio with SQLModel as
            the shared schema, to achieve one validation and storage path,
            accepting dual-server process complexity.
          modules:
            - app/service.py
            - app/api.py
            - app/grpc_server.py
            - app/models.py
            - main.py
        acceptance_criteria:
          - FastAPI handlers and gRPC servicers call the same SessionService methods
          - No business SQL or disk I/O lives in transport modules beyond mapping
          - Phone/camera JSON field names match the Android sources listed on the models
          - HTTP 404/422 map to gRPC NOT_FOUND/INVALID_ARGUMENT
          - Shipped on main in https://github.com/pirlruc/pixeldive/pull/1
        guardrail_refs:
          - PY-RUN-002
          - PY-CPLX-001
        tasks:
          - id: ARCH-001-T1
            status: done
            title: Factor SessionService out of REST and gRPC transports
            instructions:
              files:
                - app/service.py
                - app/api.py
                - app/grpc_server.py
                - main.py
            verification:
              - rg -n "SessionService" app/api.py app/grpc_server.py app/service.py
              - bash scripts/ci-local.sh

      - id: DATA-001
        status: done
        title: SQLModel session/image schema, async PostgreSQL, content-addressed storage
        overview:
          problem: >-
            Sessions must persist device specs and image blobs with cascade
            delete. A naive UUID-per-file store duplicates burst frames from
            Camera2. SQLAlchemy `metadata` is reserved, so the JSON bag needs
            an explicit column mapping.
          goal: >-
            SQLModel tables for Session and SessionImage, async engine via
            asyncpg, init_db() for empty databases, and a StorageBackend with
            local filesystem plus S3-compatible adapter. Blobs are SHA-256
            addressed so identical payloads share a path; DB rows stay unique.
        architecture:
          target: Async SQLModel + StorageBackend protocol
          modules:
            - app/models.py
            - app/database.py
            - app/storage.py
            - app/config.py
        acceptance_criteria:
          - Session.images cascade delete on session removal (FK ondelete CASCADE)
          - extra_metadata maps to column metadata without colliding with MetaData
          - init_db() creates tables when absent
          - Identical payloads reuse storage_path; delete GCs a path only at refcount 0
          - STORAGE_BACKEND=s3 uses the S3-compatible adapter
          - Shipped on main in https://github.com/pirlruc/pixeldive/pull/1
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: DATA-001-T1
            status: done
            title: Define SQLModel tables and async engine
            instructions:
              files:
                - app/models.py
                - app/database.py
                - app/config.py
            verification:
              - uv run pytest tests/test_models.py tests/test_service.py
          - id: DATA-001-T2
            status: done
            title: Implement local and S3-compatible storage backends
            instructions:
              files:
                - app/storage.py
            verification:
              - uv run pytest tests/test_storage.py

      - id: API-001
        status: done
        title: REST and gRPC session/image transports
        overview:
          problem: >-
            Mobile clients need multipart REST; high-throughput capture needs
            client-streaming gRPC. The surface must cover create/get/update/delete
            session plus single, batch, list, and download image operations.
          goal: >-
            Implement every REST route under /api/v1 and every rpc in
            proto/session_service.proto against SessionService, including
            concurrent batch disk writes and streamed image bytes.
        architecture:
          target: FastAPI router + grpcio aio servicer
          modules:
            - app/api.py
            - app/grpc_server.py
            - proto/session_service.proto
        acceptance_criteria:
          - POST/GET/PUT/DELETE /api/v1/sessions and image routes behave as specified
          - Batch REST upload accepts List[UploadFile] and saves concurrently
          - gRPC UploadImage / UploadImagesBatch are client-streaming
          - gRPC DownloadImage is server-streaming
          - Missing resources are HTTP 404 / gRPC NOT_FOUND
          - Shipped on main in https://github.com/pirlruc/pixeldive/pull/1
        guardrail_refs:
          - PY-RUN-002
          - PY-TEST-002
        tasks:
          - id: API-001-T1
            status: done
            title: Implement FastAPI session and image routes
            instructions:
              files:
                - app/api.py
                - proto/session_service.proto
            verification:
              - uv run pytest tests/test_api.py
          - id: API-001-T2
            status: done
            title: Implement gRPC SessionService servicer
            instructions:
              files:
                - app/grpc_server.py
                - proto/session_service.proto
            verification:
              - uv run pytest tests/test_grpc.py

      - id: QUAL-001
        status: done
        title: Dual-server runner, Python quality gates, container
        overview:
          problem: >-
            REST and gRPC must share one asyncio loop. Python PY-* gates need
            a consumer threshold copy because pirlruc/guardrails is private.
            The image is a product artifact (DOCKER-*), not a tool container.
          goal: >-
            main.py runs Uvicorn and the gRPC aio server together. ci-local.sh
            enforces ruff, mypy, pytest 95/95, interrogate, and radon against
            config/python.profile.thresholds.yml. Dockerfile is multi-stage,
            non-root, and env-configured.
        architecture:
          target: Concurrent asyncio runner plus PY-* CI parity
          modules:
            - main.py
            - Dockerfile
            - docker-compose.yml
            - scripts/ci-local.sh
            - .github/workflows
        acceptance_criteria:
          - FastAPI and gRPC start in one process and one event loop
          - bash scripts/ci-local.sh is the local PY-* parity entrypoint
          - Dockerfile uses a non-root USER and exec-form ENTRYPOINT
          - Tests use SQLite aiosqlite; production default is PostgreSQL asyncpg
          - Shipped on main in https://github.com/pirlruc/pixeldive/pull/1
        guardrail_refs:
          - PY-QUAL-001
          - PY-TEST-002
          - PY-DOC-001
          - PY-CPLX-001
          - PY-CPLX-002
          - DOCKER-BUILD-001
          - DOCKER-RUN-001
        tasks:
          - id: QUAL-001-T1
            status: done
            title: Dual-server runner and container image
            instructions:
              files:
                - main.py
                - Dockerfile
                - docker-compose.yml
            verification:
              - test -f Dockerfile
              - test -f main.py
          - id: QUAL-001-T2
            status: done
            title: Pytest coverage and local CI parity scripts
            instructions:
              files:
                - tests
                - scripts/ci-local.sh
                - scripts/check-complexity.py
                - config/python.profile.thresholds.yml
            verification:
              - bash scripts/ci-local.sh

  - name: Phase 2 — Hardening & scale
    epics:
      - id: REV-001
        status: done
        title: Record Phase 1 review findings and immediate hardening
        overview:
          problem: >-
            The Phase 1 dual-transport service is functionally complete, but a
            review found header injection in Content-Disposition, local storage
            path escape if a row is poisoned, unbounded gRPC upload buffers,
            unbounded batch cardinality, N+1 blob GC, and several scale/security
            gaps that must not be forgotten.
          goal: >-
            Fix the cheap, high-impact defects in-tree (filename sanitization,
            contained local paths, upload/batch ceilings, single-query GC,
            missing-blob 404) and record remaining work as Phase 2 epics rather
            than a parallel ADR tree.
        architecture:
          target: >-
            In the context of a first production-shaped ingest API, facing
            review findings that mix defects and roadmap items, we decided to
            patch the defects immediately and log the rest as github-issue-adr
            epics, to keep Phase 1 shippable without burying residual risk.
          modules:
            - app/filenames.py
            - app/local_storage.py
            - app/grpc_streams.py
            - app/service.py
            - docs/issues.yml
        acceptance_criteria:
          - Client filenames cannot inject headers or path separators
          - Local blob keys cannot resolve outside STORAGE_ROOT
          - gRPC assembly aborts when bytes or batch cardinality exceed settings
          - Session delete GC issues one distinct-path query, not one per blob
          - Remaining risks are owned by SEC-001, PERF-001, DATA-002, OPS-001, API-002
          - Shipped on main in https://github.com/pirlruc/pixeldive/pull/1
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: REV-001-T1
            status: done
            title: Sanitize filenames, contain local paths, bound uploads and GC
            instructions:
              files:
                - app/filenames.py
                - app/local_storage.py
                - app/grpc_streams.py
                - app/service.py
                - app/api.py
                - app/config.py
            verification:
              - bash scripts/ci-local.sh

      - id: SEC-001
        status: done
        title: Authenticate REST and gRPC; terminate TLS
        overview:
          problem: >-
            Phase 1 is an unauthenticated ingest API on a trusted network.
            gRPC binds an insecure port. Any caller who can reach the process
            can create sessions, read device JSON, and download every image.
          goal: >-
            Add transport auth (mTLS and/or bearer tokens shared by REST and
            gRPC) so SessionService remains the single authorization point.
            Terminate TLS for gRPC; do not keep plaintext as the production
            default.
        architecture:
          target: >-
            In the context of Android capture clients on untrusted networks,
            facing an open dual-transport ingest surface, we decided on a
            shared auth dependency in SessionService (or a gateway in front of
            both ports) rather than per-transport checks, to keep authorization
            from drifting, accepting operational key/cert management.
          modules:
            - app/api.py
            - app/grpc_server.py
            - app/service.py
            - main.py
        acceptance_criteria:
          - Unauthenticated REST calls return 401/403
          - Unauthenticated gRPC calls return UNAUTHENTICATED/PERMISSION_DENIED
          - Production gRPC is TLS (or mTLS); insecure bind is explicit/dev-only
          - Authz is session-scoped (a token cannot read another tenant's images)
        guardrail_refs:
          - PY-RUN-002
        tasks:
          - id: SEC-001-T1
            status: done
            title: Design the shared credential and session-ownership model
            instructions:
              files:
                - docs/issues.yml
                - app/service.py
            verification:
              - rg -n "UNAUTHENTICATED|401" app docs/issues.yml
          - id: SEC-001-T2
            status: done
            title: Implement REST and gRPC auth plus TLS bind options
            instructions:
              files:
                - app/api.py
                - app/grpc_server.py
                - main.py
            verification:
              - bash scripts/ci-local.sh

      - id: PERF-001
        status: done
        title: Stream ingest, bound concurrency, and paginate lists
        overview:
          problem: >-
            Uploads are fully buffered in memory (REST multipart, gRPC
            assemble_single/batch) then SHA-256 hashed as one blob. Batch REST
            reads files sequentially before concurrent disk writes. S3 uses
            blocking boto3 via to_thread with an extra HEAD before PUT.
            list_images has no cursor. High-throughput Camera2 bursts will OOM
            or stall the event loop.
          goal: >-
            Spool uploads to disk while hashing incrementally, cap concurrent
            saves, and paginate image lists. Keep SessionService as the owner
            of those limits. Async S3 I/O is PERF-002.
        architecture:
          target: Streaming ingest with bounded fan-out behind SessionService
          modules:
            - app/service.py
            - app/api.py
            - app/grpc_streams.py
            - app/s3_storage.py
        acceptance_criteria:
          - Peak memory per upload is O(chunk) plus a disk/S3 spool, not O(file)
          - Concurrent blob writes are capped (semaphore), not one task per file
          - List endpoints accept limit/cursor and do not return unbounded rows
          - S3 save does not require a blocking HEAD+PUT round trip on the loop
        guardrail_refs:
          - PY-CPLX-001
        tasks:
          - id: PERF-001-T1
            status: done
            title: Replace in-memory ImageUpload.payload with a spool + digest
            instructions:
              files:
                - app/service.py
                - app/api.py
                - app/grpc_streams.py
            verification:
              - bash scripts/ci-local.sh
          - id: PERF-001-T2
            status: done
            title: Paginate list_images and bound batch fan-out
            instructions:
              files:
                - app/service.py
                - app/api.py
                - proto/session_service.proto
            verification:
              - bash scripts/ci-local.sh

      - id: DATA-002
        status: done
        title: Alembic migrations, GC races, and orphan blob sweeper
        overview:
          problem: >-
            init_db() is create_all; live schema changes will break existing
            databases. Blob GC checks refcount then deletes without a lock, so
            a concurrent upload of the same hash can lose the object. Failed
            DB inserts after a successful save leave orphans. status is an
            unconstrained string. camera_count is not checked against
            len(cameras).
          goal: >-
            Alembic for PostgreSQL, transactional or compare-and-swap GC,
            a periodic sweeper for unreferenced objects, and CHECK/constraint
            coverage for status and camera_count.
        architecture:
          target: Alembic + refcount-safe GC
          modules:
            - app/database.py
            - app/service.py
            - app/models.py
        acceptance_criteria:
          - Schema changes ship as Alembic revisions; create_all is test/dev only
          - Deleting a session cannot remove a blob still referenced by another
            session that inserted concurrently
          - Orphan objects are reclaimed by a sweeper
          - Invalid status strings cannot persist
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: DATA-002-T1
            status: done
            title: Add Alembic and stop using create_all in production
            instructions:
              files:
                - app/database.py
                - app/migrate.py
                - migrations
                - alembic.ini
            verification:
              - test -d migrations
          - id: DATA-002-T2
            status: done
            title: Make blob GC race-safe and add an orphan sweeper
            instructions:
              files:
                - app/service.py
                - app/storage.py
            verification:
              - bash scripts/ci-local.sh

      - id: OPS-001
        status: done
        title: Readiness probe, pool settings, metrics, and structured logs
        overview:
          problem: >-
            /health is process-liveness only; Docker HEALTHCHECK and load
            balancers will keep a replica in rotation when PostgreSQL is down.
            The async engine uses SQLAlchemy defaults (no pool_pre_ping,
            no size). There are no RED metrics or request IDs. Dual-server
            shutdown waits on uvicorn.serve() and gRPC independently.
          goal: >-
            Split liveness and readiness, tune the asyncpg pool, emit
            structured logs with request/rpc IDs, and export ingest latency
            and blob size histograms.
        architecture:
          target: Probe + metrics sidecar-friendly process
          modules:
            - app/api.py
            - app/database.py
            - main.py
        acceptance_criteria:
          - Readiness fails when the database cannot be reached
          - pool_pre_ping (or equivalent) is on for PostgreSQL
          - Request/rpc identifiers appear in logs
          - At least request count, error count, and upload bytes are exported
        guardrail_refs:
          - DOCKER-RUN-006
        tasks:
          - id: OPS-001-T1
            status: done
            title: Add /ready that checks PostgreSQL and tune the engine pool
            instructions:
              files:
                - app/api.py
                - app/database.py
                - Dockerfile
            verification:
              - bash scripts/ci-local.sh

      - id: API-002
        status: done
        title: Session listing, metadata patch semantics, hide storage_path
        overview:
          problem: >-
            There is no GET /sessions. Image list is unbounded. PUT metadata
            replaces the bag; protobuf Struct cannot distinguish omit vs clear.
            SessionImageRead returns storage_path, leaking the content-addressed
            layout. camera_count can disagree with cameras.length.
          goal: >-
            Add paginated session listing, explicit metadata merge vs replace,
            drop storage_path from public DTOs (keep it internal), and reject
            camera_count mismatches.
        architecture:
          target: Additive REST/gRPC list + tighter public DTOs
          modules:
            - app/api.py
            - app/models.py
            - proto/session_service.proto
        acceptance_criteria:
          - Clients can list sessions with a cursor
          - Public image JSON does not include storage_path
          - Metadata update has documented merge or replace semantics on both
            transports
          - camera_count must equal len(cameras)
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: API-002-T1
            status: done
            title: Add paginated session list and hide storage_path
            instructions:
              files:
                - app/api.py
                - app/models.py
                - proto/session_service.proto
            verification:
              - bash scripts/ci-local.sh

      - id: SDK-001
        status: done
        title: Python SDK and capture demo application
        overview:
          problem: >-
            Phase 2 transports are usable from curl and grpcurl, but there is no
            first-party client or sample app for Android-shaped session payloads.
            Agents and capture clients need a thin SDK plus a browser demo that
            exercises create/list/upload/download through that SDK.
          goal: >-
            Ship pixeldive_sdk (async REST + gRPC) and a FastAPI demo UI that
            talks to the session service only through RestClient, so SDK usage
            is tested on an application rather than only in unit tests.
        architecture:
          target: >-
            In the context of capture clients integrating pixeldive, facing
            dual REST/gRPC surfaces, we decided on a thin Python SDK plus a
            demo FastAPI app rather than embedding HTTP calls in the UI, to
            keep the public client contract testable and documented.
          modules:
            - sdk/pixeldive_sdk
            - demo
            - tests/test_sdk.py
        acceptance_criteria:
          - RestClient covers health, ready, session CRUD, image upload/list/download
          - GrpcClient can create a session, list sessions, and upload an image
          - Demo UI creates a session, uploads an image, and downloads it via the SDK
          - Public image JSON from the SDK does not include storage_path
        guardrail_refs:
          - PY-TEST-002
          - PY-DOC-001
        tasks:
          - id: SDK-001-T1
            status: done
            title: Implement pixeldive_sdk RestClient and GrpcClient
            instructions:
              files:
                - sdk/pixeldive_sdk
            verification:
              - bash scripts/ci-local.sh
          - id: SDK-001-T2
            status: done
            title: Implement demo FastAPI app that uses the SDK
            instructions:
              files:
                - demo
            verification:
              - bash scripts/ci-local.sh

      - id: PERF-002
        status: done
        title: Replace boto3 to_thread with an async S3 client
        overview:
          problem: >-
            S3 save/stream still used blocking boto3 via asyncio.to_thread.
            PERF-001 removed the extra HEAD-before-PUT and spools uploads, but
            a large object still occupied a worker thread for the whole PUT.
          goal: >-
            Use an async S3 client (aiobotocore) so blob I/O does not occupy
            the default executor. Keep SessionService as the owner of storage
            limits. Whole-file PUT memory remains PERF-003.
        architecture:
          target: >-
            In the context of S3-compatible blob I/O on the asyncio loop,
            facing blocking boto3, we decided on a lazy aiobotocore adapter
            behind StorageBackend rather than wrapping boto3 in to_thread, to
            keep PUT/GET off the default executor while build_storage stays
            synchronous.
          modules:
            - app/s3_storage.py
            - app/s3_client.py
            - app/s3_session.py
            - app/s3_types.py
            - requirements.txt
        acceptance_criteria:
          - S3 save_file and stream await an async client (no boto3, no to_thread)
          - Local filesystem backend behaviour is unchanged
          - Tests cover the async adapter with a fake client
        guardrail_refs:
          - PY-CPLX-001
        tasks:
          - id: PERF-002-T1
            status: done
            title: Swap S3CompatibleStorage to an async client
            instructions:
              files:
                - app/s3_storage.py
                - app/s3_client.py
                - requirements.txt
            verification:
              - bash scripts/ci-local.sh

  - name: Phase 3 — Remaining hardening
    epics:
      - id: TOOL-002
        status: open
        title: Publish GitHub Epic/Task issues from docs/issues.yml
        overview:
          problem: >-
            github-issue-adr treats GitHub issues as the decision log, but
            pixeldive has never run issues-sync.py against the live tracker.
            Statuses live only in docs/issues.yml. Publishing is gated on
            Issues: write plus the github-scaffold analog (TOOL-001-T1).
          goal: >-
            After TOOL-001-T1 and an Issues: write token, dry-run then apply
            issues-sync.py so every authored Epic/Task exists on GitHub with
            stable [ID] titles. Do not gh issue create by hand.
        architecture:
          target: Manifest-driven GitHub issues via issues-sync.py
          modules:
            - docs/issues.yml
            - scripts/issues-sync.sh
            - docs/issues-sync-targets.yml
        acceptance_criteria:
          - issues-sync.py --dry-run shows create/update with no schema errors
          - Applying the sync creates GitHub issues whose titles contain the YAML ids
          - No issues are created outside the manifest
        guardrail_refs:
          - CI-022
        tasks:
          - id: TOOL-002-T1
            status: open
            title: Dry-run and apply issues-sync.py to pirlruc/pixeldive
            instructions:
              files:
                - docs/issues.yml
                - scripts/issues-sync.sh
            verification:
              - bash scripts/issues-sync.sh --repo pirlruc/pixeldive --yaml docs/issues.yml --validate-only
              - bash scripts/issues-sync.sh --repo pirlruc/pixeldive --yaml docs/issues.yml --dry-run

      - id: SEC-002
        status: open
        title: Per-tenant rate limits and upload quotas
        overview:
          problem: >-
            AUTH_REQUIRED plus API_KEYS identify a tenant, but there is no
            request-rate or upload-byte quota. A captured key (or a bursty
            Camera2 client) can spool unbounded objects and stall the event
            loop or fill the blob store.
          goal: >-
            Enforce per-tenant request rate and per-session/per-tenant upload
            byte caps in SessionService so REST and gRPC share one limiter.
            Unauthenticated local/dev remains unlimited when AUTH_REQUIRED is
            false.
        architecture:
          target: >-
            In the context of tenant-scoped ingest, facing unbounded request
            and byte volume, we decided on SessionService-owned quotas rather
            than a reverse-proxy-only limiter, to keep REST and gRPC under the
            same cap.
          modules:
            - app/service.py
            - app/auth.py
            - app/config.py
        acceptance_criteria:
          - Authenticated tenants have a configurable request-rate cap
          - Upload bytes per tenant (or per session) are capped
          - AUTH_REQUIRED=false does not require quota configuration
          - REST 429 and gRPC RESOURCE_EXHAUSTED map to the same service error
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: SEC-002-T1
            status: open
            title: Add per-tenant rate and byte quotas behind SessionService
            instructions:
              files:
                - app/service.py
                - app/auth.py
                - app/config.py
            verification:
              - bash scripts/ci-local.sh

      - id: API-003
        status: open
        title: Bring GrpcClient to RestClient session/image parity
        overview:
          problem: >-
            RestClient covers health, ready, session CRUD, image list, and
            download. GrpcClient only wraps CreateSession, ListSessions, and
            UploadImage. Capture clients that prefer gRPC cannot get, update,
            delete, list images, download, or batch-upload through the SDK.
          goal: >-
            Expose the remaining SessionService RPCs on GrpcClient with the
            same call shapes the REST client already documents, without
            changing proto.
        architecture:
          target: Additive GrpcClient methods over the existing proto
          modules:
            - sdk/pixeldive_sdk/grpc_calls.py
            - sdk/pixeldive_sdk/grpc_mapping.py
            - tests/test_sdk.py
        acceptance_criteria:
          - GrpcClient can get, update, and delete a session
          - GrpcClient can list images, download an image, and batch-upload
          - Public image messages still omit storage_path
        guardrail_refs:
          - PY-TEST-002
          - PY-DOC-001
        tasks:
          - id: API-003-T1
            status: open
            title: Wrap remaining SessionService RPCs on GrpcClient
            instructions:
              files:
                - sdk/pixeldive_sdk/grpc_calls.py
                - sdk/pixeldive_sdk/grpc_mapping.py
            verification:
              - bash scripts/ci-local.sh

      - id: PERF-003
        status: open
        title: Multipart or chunked S3 PUT so save_file is O(chunk)
        overview:
          problem: >-
            PERF-002 awaits aiobotocore, but save_file still reads the whole
            spool into process memory before put_object(Body=bytes). Large
            Camera2 frames therefore remain O(file) on the S3 path.
          goal: >-
            Upload spooled files with S3 multipart (or an equivalent streaming
            PUT) so peak memory per object is O(chunk), matching the local
            filesystem spool.
        architecture:
          target: Streaming/multipart PUT behind S3CompatibleStorage.save_file
          modules:
            - app/s3_storage.py
            - app/s3_client.py
        acceptance_criteria:
          - save_file peak memory is O(chunk), not O(file)
          - Content-addressed keys and idempotent overwrite behaviour are unchanged
          - Local filesystem backend behaviour is unchanged
        guardrail_refs:
          - PY-CPLX-001
        tasks:
          - id: PERF-003-T1
            status: open
            title: Stream spool files to S3 with multipart upload
            instructions:
              files:
                - app/s3_storage.py
            verification:
              - bash scripts/ci-local.sh

      - id: PERF-004
        status: open
        title: Chunk SDK uploads instead of one in-memory payload
        overview:
          problem: >-
            RestClient.upload_image POSTs the whole bytes blob as one multipart
            part. GrpcClient.UploadImage yields a single ImageChunk. Capture
            clients that already have a file on disk still load it entirely
            before the SDK call.
          goal: >-
            Accept a path or async iterator on both clients and stream chunks
            to REST multipart / gRPC client-streaming, keeping peak SDK memory
            O(chunk).
        architecture:
          target: Streaming upload helpers on RestClient and GrpcClient
          modules:
            - sdk/pixeldive_sdk/rest_images.py
            - sdk/pixeldive_sdk/grpc_calls.py
        acceptance_criteria:
          - Both clients can upload from a file path without buffering the whole file
          - gRPC yields multiple ImageChunk messages above a documented size
          - Existing bytes-in APIs remain for small payloads and tests
        guardrail_refs:
          - PY-CPLX-001
        tasks:
          - id: PERF-004-T1
            status: open
            title: Add path/iterator upload APIs to RestClient and GrpcClient
            instructions:
              files:
                - sdk/pixeldive_sdk/rest_images.py
                - sdk/pixeldive_sdk/grpc_calls.py
            verification:
              - bash scripts/ci-local.sh

      - id: OPS-002
        status: open
        title: Coordinated dual-server shutdown and storage close
        overview:
          problem: >-
            run() gathers uvicorn.serve() and grpc wait_for_termination().
            SIGTERM stops them independently; the lazy aiobotocore client is
            never aclosed, and gRPC stop(grace=5) runs only in finally after
            one of the two tasks ends.
          goal: >-
            On SIGTERM/SIGINT, stop HTTP and gRPC together, await storage
            client close when present, then dispose the engine, so replicas
            drain in-flight RPCs without leaking HTTP sessions to S3.
        architecture:
          target: Single shutdown path in main.run
          modules:
            - main.py
            - app/s3_client.py
            - app/storage.py
        acceptance_criteria:
          - One signal handler (or equivalent) stops both servers
          - AioS3Adapter.aclose is invoked when STORAGE_BACKEND=s3
          - Engine dispose still runs after servers stop
        guardrail_refs:
          - DOCKER-RUN-006
        tasks:
          - id: OPS-002-T1
            status: open
            title: Drain REST and gRPC together and close the S3 adapter
            instructions:
              files:
                - main.py
                - app/storage.py
            verification:
              - bash scripts/ci-local.sh

      - id: OPS-003
        status: open
        title: MinIO Compose profile for S3-backend integration tests
        overview:
          problem: >-
            STORAGE_BACKEND=s3 is unit-tested with FakeS3 only. Compose runs
            local filesystem storage. A mis-pinned aiobotocore/botocore pair
            or a real MinIO listing quirk would not be caught in CI.
          goal: >-
            Add an optional Compose profile (or CI job) that boots MinIO,
            points the app at STORAGE_BACKEND=s3, and runs a small ingest
            round-trip. Default Compose stays local-disk for cheap dev.
        architecture:
          target: Optional MinIO service plus S3 env overlay
          modules:
            - docker-compose.yml
            - .github/workflows/quality.yml
        acceptance_criteria:
          - docker compose --profile s3 up boots MinIO and the app on S3
          - A documented command uploads and downloads one image via REST
          - Default (no profile) Compose behaviour is unchanged
        guardrail_refs:
          - DOCKER-RUN-006
        tasks:
          - id: OPS-003-T1
            status: open
            title: Add a Compose s3 profile with MinIO
            instructions:
              files:
                - docker-compose.yml
            verification:
              - docker compose --profile s3 config

      - id: DATA-003
        status: open
        title: Run a PostgreSQL integration job beside SQLite unit tests
        overview:
          problem: >-
            Unit tests use sqlite+aiosqlite. Production is PostgreSQL+asyncpg
            with Alembic. JSON columns, pool_pre_ping, and dialect-specific
            CHECK behaviour can pass SQLite and fail on Postgres.
          goal: >-
            Keep SQLite for fast PY-TEST-002 unit gates, and add a CI job
            (service container or Compose) that applies Alembic and runs the
            service tests against PostgreSQL.
        architecture:
          target: Extra CI job with Postgres; SQLite remains the local default
          modules:
            - .github/workflows/quality.yml
            - tests
        acceptance_criteria:
          - CI runs SessionService tests against PostgreSQL
          - Local `bash scripts/ci-local.sh` still uses SQLite
          - Alembic upgrade is the schema path in that job (AUTO_CREATE_TABLES=false)
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: DATA-003-T1
            status: open
            title: Add a PostgreSQL pytest job to quality.yml
            instructions:
              files:
                - .github/workflows/quality.yml
            verification:
              - rg -n "postgres" .github/workflows/quality.yml

