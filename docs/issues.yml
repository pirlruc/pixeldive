            - scripts/issues-sync.sh
            - docs/issues-sync-targets.yml
        acceptance_criteria:
          - issues-sync.py --dry-run shows create/update with no schema errors
          - Applying the sync creates GitHub issues whose titles contain the YAML ids
          - No issues are created outside the manifest
        guardrail_refs:
