      - id: SEC-006
        status: done
        title: Production fail-closed auth and upload sniffing
        overview:
          problem: >-
            AUTH_REQUIRED and GRPC_INSECURE default off for tests. A production
            process could bind 0.0.0.0 with no credentials. Uploads trusted
            Content-Type. API key lookup used dict membership. In-process
            quotas raced. Downloads hit the rate limiter twice.
          goal: >-
            ENVIRONMENT=production refuses to start without auth and gRPC TLS.
            Image magic bytes must match the declared type. Token compare uses
            hmac.compare_digest. Quota mutations take a lock. stream_image
            reuses an already-loaded row.
        architecture:
          target: >-
            In the context of opt-in auth for local tests, facing accidental
            production exposure, we decided a named production profile
            fail-closed plus magic-byte sniffing rather than flipping the
            development defaults that every unit test relies on.
          modules:
            - app/runtime.py
            - app/magic.py
            - app/auth.py
            - app/quotas.py
            - app/session_ops.py
        acceptance_criteria:
          - ENVIRONMENT=production with AUTH_REQUIRED=false raises at startup
          - PNG declared as JPEG (or raw bytes as PNG) is 422
          - Unknown bearer tokens still 401
          - Download after get_image does not consume a second quota hit
        guardrail_refs:
          - PY-SEC-002
          - PY-TEST-002
        tasks:
          - id: SEC-006-T1
            status: done
            title: Fail closed in production and sniff upload magic
            instructions:
              files:
                - app/runtime.py
                - app/magic.py
                - app/auth.py
                - app/quotas.py
            verification:
              - bash scripts/ci-local.sh

      - id: SEC-007
        status: done
        title: Terminate TLS for HTTP; share PEM files with gRPC
        overview:
          problem: >-
            SEC-001 and SEC-006 encrypt gRPC and fail-closed when
            GRPC_INSECURE is true in production, but uvicorn still binds
            plaintext HTTP. Bearer tokens and image bytes then travel in the
            clear on the REST port even when ENVIRONMENT=production.
          goal: >-
            Give HTTP the same TLS (and optional mTLS) bind as gRPC. One
            TLS_CERT_FILE / TLS_KEY_FILE pair can serve both transports.
            Production refuses HTTP_INSECURE=true. SDKs accept a custom CA
            (httpx verify, gRPC root_certificates) so self-signed lab certs
            work without disabling verification.
        architecture:
          target: >-
            In the context of dual-transport ingest on untrusted networks,
            facing REST still on plaintext after gRPC TLS shipped, we decided
            on shared PEM resolution plus uvicorn SSLContext rather than a
            reverse proxy in-process, so both listeners encrypt with the same
            operator-supplied files and SessionService stays the authz point.
          modules:
            - app/tls_files.py
            - app/http_tls.py
            - app/grpc_tls.py
            - app/runtime.py
            - app/ready_probe.py
            - sdk/pixeldive_sdk
        acceptance_criteria:
          - ENVIRONMENT=production with HTTP_INSECURE=true raises at startup
          - HTTPS RestClient with verify=server.pem can health-check and upload
          - TLS GrpcClient with root_certificates can create a session
          - Empty Compose TLS_* strings do not become Path('')
          - Docker HEALTHCHECK uses ready_probe (HTTP or HTTPS)
        guardrail_refs:
          - PY-SEC-002
          - PY-TEST-002
        tasks:
          - id: SEC-007-T1
            status: done
            title: Add HTTP TLS, shared PEM resolution, and SDK custom CA
            instructions:
              files:
                - app/tls_files.py
                - app/http_tls.py
                - app/runtime.py
                - sdk/pixeldive_sdk
            verification:
              - bash scripts/ci-local.sh

      - id: SEC-008
        status: done
        title: Close upload-size, batch, and production-quota gaps
        overview:
          problem: >-
            REST batch spooled every part before max_batch_images. Validation
            trusted a caller size_bytes over the spool or payload. Metadata
            JSON had no size cap. ENVIRONMENT=production allowed unlimited
            quotas. S3 re-PUT every duplicate key. The demo read each JPEG
            into one bytes object before gRPC. Single and batch gRPC ingest
            duplicated abort and session_id checks.
          goal: >-
            Reject oversized REST batches before spool I/O, measure bytes from
            the spool or payload, cap metadata, require positive production
            quotas, skip repeat S3 puts inside one process, and spill demo
            uploads to a capped temp file streamed by the SDK.
        architecture:
          target: >-
            In the context of camera and multipart ingest, facing quota and
            disk abuse that auth alone does not stop, we decided to fail
            closed on measured size and production caps rather than add a
            second quota store (that remains SEC-004).
          modules:
            - app/upload_validate.py
            - app/api_images.py
            - app/metadata.py
            - app/runtime.py
            - app/s3_storage.py
            - app/grpc_errors.py
            - demo
        acceptance_criteria:
          - A lying size_bytes does not change the stored image length
          - REST batch over max_batch_images is 422 and stores nothing
          - Metadata over 65536 characters is 422
          - ENVIRONMENT=production with a zero quota raises at startup
          - A second S3 save of the same key in-process does not PUT again
          - Demo upload streams from a temp file and rejects bodies over the cap
        guardrail_refs:
          - PY-SEC-002
          - PY-CPLX-001
          - PY-TEST-002
        tasks:
          - id: SEC-008-T1
            status: done
            title: Measure uploads, cap batches and metadata, and share ingest aborts
            instructions:
              files:
                - app/upload_validate.py
                - app/api_images.py
                - app/runtime.py
                - app/s3_storage.py
                - app/grpc_errors.py
                - demo/routes.py
            verification:
              - bash scripts/ci-local.sh

      - id: SEC-005
        status: open
        title: Move the quota hot path to Redis when Postgres contends
        overview:
          problem: >-
            SEC-004 shares TenantQuota through PostgreSQL so two app replicas
            honour one cap. That is enough for first multi-replica tests.
            Many Camera2 clients against many replicas can turn every
            rate-limit hit into a Postgres write; INCR/TTL in Redis is the
            usual hot-path tool. Phone count against a single replica does
            not by itself require Redis (SEC-002 already caps that process).
          goal: >-
            Keep the SessionService quota API. After SEC-004, offer a Redis
            backend for request-rate hits (and optionally byte reservations)
            when ingest QPS or replica count contends on Postgres. AUTH_REQUIRED
            false stays unlimited; store failure stays fail-closed.
        architecture:
          target: >-
            In the context of scaled Camera2 ingest, facing Postgres quota
            writes on the request path, we decided to keep PostgreSQL as the
            first shared store (SEC-004) and add Redis only when that hot
            path contends, rather than introducing Redis for the first test
            of shared quotas.
          modules:
            - app/quotas.py
            - docker-compose.yml
        acceptance_criteria:
          - Redis is optional; default shared backend remains PostgreSQL (SEC-004)
          - Two processes sharing Redis honour one rate budget
          - AUTH_REQUIRED=false remains unlimited
          - Redis down fails closed when quotas are configured
        guardrail_refs:
          - PY-TEST-002
        tasks:
          - id: SEC-005-T1
            status: open
            title: Add an optional Redis TenantQuota backend behind the existing API
            instructions:
              files:
                - app/quotas.py
                - docker-compose.yml
            verification:
              - bash scripts/ci-local.sh

  - name: Mobile clients
    epics:
