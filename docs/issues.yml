            demo app and client-stream them on gRPC while keeping session APIs
            on REST.
          modules:
            - ios/Demo
            - android/demo
            - demo
        acceptance_criteria:
          - iOS demo starts an AVCapture session and uploads JPEGs via PixeldiveGrpcClient
          - Android demo starts CameraX and uploads JPEGs via PixeldiveGrpcClient
          - Python demo getUserMedia frames POST through DemoClients which uses GrpcClient
        guardrail_refs:
