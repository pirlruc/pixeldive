      - id: SDK-004
        status: done
        title: Stream camera-session file uploads from mobile and Python SDKs
        overview:
          problem: >-
            Phone camera sessions send many frames. The iOS file-URL upload read
            the whole file into Data, Android used File.readBytes(), and the
            Python gRPC batch helper only accepted in-memory tuples. That doubles
            peak RAM on a burst and is the wrong shape for a capture session.
          goal: >-
            Stream file-backed uploads: iOS writes a temp multipart from the file
            handle, Android uses OkHttp asRequestBody, and Python REST/gRPC batch
            from paths without buffering whole payloads.
        architecture:
          target: >-
            In the context of camera capture sessions uploading many images,
            facing in-memory file reads on every SDK, we decided to stream
            file-backed multipart and gRPC chunks from disk while keeping the
            in-memory frame APIs for CMSampleBuffer/Camera2 byte arrays.
          modules:
            - ios/Sources/PixeldiveSDK
            - android/sdk
            - sdk/pixeldive_sdk
        acceptance_criteria:
          - iOS uploadImage(fileURL:) does not call Data(contentsOf:) on the image
          - Android uploadImage(File) uses RequestBody.asRequestBody
          - Python RestClient and GrpcClient can batch-upload from filesystem paths
        guardrail_refs:
          - PY-TEST-002
          - SWIFT-TEST-002
          - KT-TEST-002
        tasks:
          - id: SDK-004-T1
            status: done
            title: Stream file-backed uploads in iOS, Android, and Python SDKs
            instructions:
              files:
                - ios/Sources/PixeldiveSDK
                - android/sdk
                - sdk/pixeldive_sdk
            verification:
              - bash scripts/ci-local.sh

      - id: SDK-005
        status: done
        title: Stream in-memory camera frames over gRPC next to the REST SDKs
        overview:
          problem: >-
            Camera capture already holds each frame in RAM. REST multipart on iOS
            concatenates a second Data copy, and neither mobile SDK could speak
            the existing client-streaming UploadImage / server-streaming
            DownloadImage RPCs. Phone bursts belong on gRPC, not gallery multipart.
          goal: >-
            Add PixeldiveGrpcClient beside PixeldiveClient on iOS and Android
            (Python already has GrpcClient). Hand-rolled protobuf + gRPC framing
            so Linux swift test does not need generated stubs; Apple uses
            grpc-swift NIO h2c, Android uses OkHttp H2_PRIOR_KNOWLEDGE.
        architecture:
          target: >-
            In the context of a phone camera session sending many in-memory
            frames, facing a second Data copy on iOS REST multipart and no mobile
            gRPC client, we decided to add client-streaming gRPC SDKs that chunk
            the existing frame buffer rather than stream a second multipart body.
          modules:
            - ios/Sources/PixeldiveSDK
            - android/sdk
            - sdk/pixeldive_sdk
        acceptance_criteria:
          - iOS and Android expose PixeldiveGrpcClient for UploadImage / UploadImagesBatch / DownloadImage
          - In-memory frames are split into ImageChunk messages (256 KiB) without a second full payload copy into multipart
          - Linux swift test compiles the codec without fetching grpc-swift into the test binary
          - SWIFT-TEST-002 and KT-TEST-002 stay at the consumer overlay
        guardrail_refs:
          - SWIFT-TEST-002
          - KT-TEST-002
        tasks:
          - id: SDK-005-T1
            status: done
            title: Add iOS and Android gRPC streaming image clients
            instructions:
              files:
                - ios/Sources/PixeldiveSDK
                - android/sdk
            verification:
              - bash scripts/check-ios-sdk.sh
              - bash scripts/check-android-sdk.sh

      - id: SDK-006
        status: done
